<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Upload Game</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #20232b; color: white; padding: 20px; font-family: sans-serif; }
        .form-container { background: #25262d; padding: 30px; border-radius: 20px; max-width: 600px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #202127; border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; }
        button { background: #35eaff; color: #172127; padding: 15px; border: none; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #20c8e0; }
        .status { margin-bottom: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
        .success { background: rgba(53, 234, 255, 0.2); color: #35eaff; border: 1px solid #35eaff; }
        .error { background: rgba(255, 10, 108, 0.2); color: #ff0a6c; border: 1px solid #ff0a6c; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Upload Game Mpya</h2>
    <div id="statusBox" class="status"></div>
    <form id="gameForm">
        <input type="text" id="title" placeholder="Jina la Game (mfano: Cyberpunk 2077)" required>
        <input type="text" id="slug" placeholder="Slug (mfano: cyberpunk-2077)" required>
        <input type="text" id="cover_image" placeholder="URL ya Picha (Image Link)" required>
        <textarea id="description" placeholder="Maelezo ya Game" rows="4"></textarea>
        <button type="submit" id="submitBtn">Upload Game</button>
    </form>
</div>

<script>
    // 1. Credentials zako za Supabase
    const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z"; // Weka funguo yako kamili hapa

    // 2. Tengeneza Supabase client bila migongano ya majina
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const gameForm = document.getElementById('gameForm');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');

    gameForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.innerText = "Inapakia data...";
        submitBtn.disabled = true;
        statusBox.style.display = 'none';

        const gameData = {
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            cover_image: document.getElementById('cover_image').value,
            description: document.getElementById('description').value
        };

        try {
            const { data, error } = await supabaseClient.from('games').insert([gameData]);

            if (error) throw error;

            statusBox.className = 'status success';
            statusBox.innerText = '✅ Game imepakiwa kwa mafanikio!';
            statusBox.style.display = 'block';
            gameForm.reset();
        } catch (err) {
            statusBox.className = 'status error';
            statusBox.innerText = '❌ Kosa: ' + err.message;
            statusBox.style.display = 'block';
            console.error(err);
        } finally {
            submitBtn.innerText = "Upload Game";
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
