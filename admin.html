<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Admin Dashboard | Kodinela Arena</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-body: #14161d;
            --bg-card: #1f222d;
            --bg-input: #171922;
            --neon-cyan: #35eaff;
            --neon-pink: #ff0a6c;
            --text-main: #ffffff;
            --text-dim: #8b8e9d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            padding: 30px 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }
        .brand { font-size: 20px; font-weight: bold; color: var(--neon-cyan); margin-bottom: 40px; letter-spacing: 2px; }
        .brand span { color: var(--neon-pink); }
        .menu-item {
            color: var(--text-dim);
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: 600;
            display: block;
            transition: 0.3s;
        }
        .menu-item.active, .menu-item:hover { background: rgba(53, 234, 255, 0.1); color: var(--neon-cyan); }

        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* STATS CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .stat-card h4 { color: var(--text-dim); font-size: 13px; text-transform: uppercase; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: var(--neon-cyan); margin-top: 5px; }

        /* CONTENT LAYOUT */
        .content-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; }
        @media(max-width: 1024px) { .content-grid { grid-template-columns: 1fr; } }

        .card-box {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-box h3 { margin-bottom: 20px; font-size: 18px; border-left: 3px solid var(--neon-pink); padding-left: 10px; }

        /* FORM STYLING */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 10px;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--neon-cyan); }
        button {
            background: var(--neon-cyan);
            color: #12141a;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 15px var(--neon-pink); }

        /* GAMES LIST TABLE */
        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--bg-input);
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .game-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .game-info { flex: 1; margin-left: 15px; }
        .game-info h5 { font-size: 15px; }
        .game-info p { font-size: 12px; color: var(--text-dim); }
        .delete-btn { background: rgba(255,10,108,0.2); color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 6px 12px; border-radius: 8px; cursor: pointer; width: auto; font-size: 12px; }
        .delete-btn:hover { background: var(--neon-pink); color: white; }

        .status { padding: 10px; border-radius: 8px; display: none; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .success { background: rgba(53, 234, 255, 0.2); color: var(--neon-cyan); }
        .error { background: rgba(255, 10, 108, 0.2); color: var(--neon-pink); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">KODINELA <span>PANEL</span></div>
        <a href="#" class="menu-item active">🎮 Manage Games</a>
        <a href="index.html" target="_blank" class="menu-item">🌐 View Website</a>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="main-content">
        <div class="header">
            <h2>Gaming Control Center</h2>
            <span style="color: var(--neon-cyan); font-weight: bold;">● System Live</span>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Games</h4>
                <div class="number" id="totalGamesCount">0</div>
            </div>
            <div class="stat-card">
                <h4>Database Status</h4>
                <div class="number" style="font-size: 18px; color:#4caf50;">Connected</div>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-grid">
            
            <!-- UPLOAD FORM -->
            <div class="card-box">
                <h3>Upload New Game</h3>
                <div id="statusBox" class="status"></div>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Game Title</label>
                        <input type="text" id="title" placeholder="e.g. GTA V" required>
                    </div>
                    <div class="form-group">
                        <label>Slug (URL Key)</label>
                        <input type="text" id="slug" placeholder="e.g. gta-v" required>
                    </div>
                    <div class="form-group">
                        <label>Category / Platform</label>
                        <select id="category">
                            <option value="PC Game">PC Game</option>
                            <option value="Android Game">Android Game</option>
                            <option value="Action">Action</option>
                            <option value="Racing">Racing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>File Size</label>
                        <input type="text" id="file_size" placeholder="e.g. 45 GB au 1.5 GB" required>
                    </div>
                    <div class="form-group">
                        <label>Cover Image URL</label>
                        <input type="url" id="cover_image" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Download Link URL</label>
                        <input type="url" id="download_url" placeholder="https://drive.google.com/..." required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" rows="3" placeholder="Maelezo kuhusu game..."></textarea>
                    </div>
                    <button type="submit" id="submitBtn">🚀 Publish Game</button>
                </form>
            </div>

            <!-- GAMES LIST -->
            <div class="card-box">
                <h3>Uploaded Games Manager</h3>
                <div id="gamesList">
                    <p style="color:var(--text-dim);">Inapakua orodha ya magame...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const uploadForm = document.getElementById('uploadForm');
        const statusBox = document.getElementById('statusBox');
        const gamesList = document.getElementById('gamesList');
        const totalGamesCount = document.getElementById('totalGamesCount');

        // 1. VUTA NA ONYESHA MAGAME YOTE
        async function loadGames() {
            try {
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                totalGamesCount.innerText = games ? games.length : 0;

                if (!games || games.length === 0) {
                    gamesList.innerHTML = `<p style="color:var(--text-dim);">Hakuna game iliyopakiwa bado.</p>`;
                    return;
                }

                gamesList.innerHTML = games.map(g => `
                    <div class="game-item">
                        <img src="${g.cover_image || 'https://picsum.photos/100'}" alt="${g.title}">
                        <div class="game-info">
                            <h5>${g.title}</h5>
                            <p>${g.category || 'PC Game'} • ${g.file_size || 'N/A'}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteGame('${g.id}')">Delete</button>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                gamesList.innerHTML = `<p style="color:var(--neon-pink);">Imeshindikana kupakua magame.</p>`;
            }
        }

        // 2. UPLOAD GAME MPYA
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Inapakia...";
            submitBtn.disabled = true;

            const gameData = {
                title: document.getElementById('title').value.trim(),
                slug: document.getElementById('slug').value.trim().toLowerCase(),
                category: document.getElementById('category').value,
                file_size: document.getElementById('file_size').value.trim(),
                cover_image: document.getElementById('cover_image').value.trim(),
                download_url: document.getElementById('download_url').value.trim(),
                description: document.getElementById('description').value.trim()
            };

            try {
                const { error } = await supabaseClient.from('games').insert([gameData]);
                if (error) throw error;

                statusBox.className = 'status success';
                statusBox.innerText = '✅ Game imepakiwa kwa mafanikio!';
                statusBox.style.display = 'block';
                uploadForm.reset();
                loadGames(); // Refresh orodha
            } catch (err) {
                statusBox.className = 'status error';
                statusBox.innerText = '❌ Kosa: ' + err.message;
                statusBox.style.display = 'block';
            } finally {
                submitBtn.innerText = "🚀 Publish Game";
                submitBtn.disabled = false;
            }
        });

        // 3. FUTA GAME
        async function deleteGame(id) {
            if (!confirm("Unahakika unataka kufuta game hii?")) return;

            try {
                const { error } = await supabaseClient.from('games').delete().eq('id', id);
                if (error) throw error;
                loadGames();
            } catch (err) {
                alert("Kosa wakati wa kufuta: " + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadGames);
    </script>
</body>
</html>
