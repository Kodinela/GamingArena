<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | Kodinela Gaming Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #14161d; --bg-card: #1f222d; --neon-cyan: #35eaff; --neon-pink: #ff0a6c; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); padding: 20px 5%; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--bg-card); padding: 20px; border-radius: 15px; }
        .brand { font-size: 22px; font-weight: bold; color: var(--neon-cyan); }
        .logout-btn { background: var(--neon-pink); color: white; padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .game-card { background: var(--bg-card); border-radius: 15px; overflow: hidden; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .game-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        .game-title { font-size: 18px; margin-bottom: 8px; }
        .game-meta { font-size: 13px; color: #888; margin-bottom: 15px; }
        .download-btn { display: block; text-align: center; background: var(--neon-cyan); color: #12141a; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .download-btn:hover { background: var(--neon-pink); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="brand">🎮 USER DASHBOARD</div>
        <div>
            <span id="userEmail" style="margin-right: 15px; color: #aaa;"></span>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </header>

    <h2>Magame Yote Yanayopatikana Kudownload:</h2>
    <br>
    <div class="games-grid" id="gamesGrid">
        <p>Inapakua magame...</p>
    </div>

    <script>
        const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. KAGUA KAMA USER AMELOGIN
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                // Kama hajalogin, msukumize login
                window.location.href = "login.html";
                return;
            }

            document.getElementById('userEmail').innerText = session.user.email;
            loadGames();
        }

        // 2. VUTA MAGAME YOTE NA UWEKE LINK ZA DOWNLOAD
        async function loadGames() {
            const container = document.getElementById('gamesGrid');
            const { data: games, error } = await supabaseClient.from('games').select('*').order('created_at', { ascending: false });

            if (error || !games || games.length === 0) {
                container.innerHTML = "<p>Bado hakuna magame yaliyopakiwa.</p>";
                return;
            }

            container.innerHTML = games.map(g => `
                <div class="game-card">
                    <img src="${g.cover_image || 'https://picsum.photos/300/180?gaming'}" alt="${g.title}">
                    <div class="game-title">${g.title}</div>
                    <div class="game-meta">${g.category || 'PC Game'} • Size: ${g.file_size || 'N/A'}</div>
                    <a href="${g.download_url || '#'}" target="_blank" class="download-btn">🚀 Download Game</a>
                </div>
            `).join('');
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
        }

        document.addEventListener('DOMContentLoaded', checkUser);
    </script>
</body>
</html>
