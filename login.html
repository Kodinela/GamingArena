<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodinela Arena | Admin Dashboard</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-body: #20232b;
            --bg-card: #25262d;
            --bg-input: #202127;
            --neon-cyan: #35eaff;
            --neon-pink: #ff0a6c;
            --text-main: #eeeeee;
            --text-dim: #777983;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================== */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 10px 0 25px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand svg {
            width: 32px;
            height: 32px;
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .brand h2 {
            font-size: 20px;
            letter-spacing: 3px;
            color: var(--text-main);
        }

        .brand h2 span {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .nav-links a svg {
            width: 20px;
            height: 20px;
            fill: var(--text-dim);
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
            background: var(--bg-input);
            box-shadow: 
                inset 3px 3px 6px rgba(0,0,0,0.4),
                0 0 12px rgba(53, 234, 255, 0.2);
        }

        .nav-links a.active svg, .nav-links a:hover svg {
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: 700;
            border-radius: 15px;
            background: var(--bg-input);
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4);
            transition: 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .logout-btn:hover {
            box-shadow: 0 0 15px rgba(255, 10, 108, 0.4);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        /* =========================
           MAIN CONTENT AREA
        ========================== */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* HEADER */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            background: var(--bg-input);
            border: none;
            outline: none;
            border-radius: 25px;
            padding: 0 20px 0 45px;
            color: var(--text-main);
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.4),
                inset -2px -2px 6px rgba(255,255,255,0.02);
        }

        .search-box svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-dim);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-info {
            text-align: right;
            font-size: 13px;
            color: var(--text-dim);
        }

        .admin-info strong {
            display: block;
            color: var(--neon-cyan);
            font-size: 14px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            padding: 2px;
            box-shadow: 0 0 10px rgba(53, 234, 255, 0.5);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-card);
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            position: relative;
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.3),
                -5px -5px 15px rgba(255,255,255,0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        .stat-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .stat-card.pink::before {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .stat-card h4 {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* CONTENT PANELS */
        .dashboard-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .panel {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.3),
                -5px -5px 15px rgba(255,255,255,0.02);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
        }

        .panel-header h3 {
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--neon-cyan);
        }

        /* FORM STYLING IN NEON STYLE */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: none;
            outline: none;
            border-radius: 12px;
            color: var(--text-main);
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4);
            font-size: 14px;
        }

        .form-control:focus {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4), 0 0 8px rgba(53, 234, 255, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-cyan), #00a8ff);
            color: #12141a;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 0 12px rgba(53, 234, 255, 0.3);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, var(--neon-pink), #ff5252);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 10, 108, 0.5);
        }

        /* GAMES LIST STYLING */
        .games-list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: var(--bg-input);
            border-radius: 12px;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-item img {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            object-fit: cover;
        }

        .game-item-info {
            flex: 1;
            margin-left: 15px;
        }

        .game-item-info h5 {
            font-size: 15px;
            color: var(--text-main);
        }

        .game-item-info p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 3px;
        }

        .delete-btn {
            background: rgba(255, 10, 108, 0.15);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .status-msg {
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .status-msg.success { background: rgba(53, 234, 255, 0.15); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
        .status-msg.error { background: rgba(255, 10, 108, 0.15); color: var(--neon-pink); border: 1px solid var(--neon-pink); }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .dashboard-panels { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h2>KODINELA<span>HUB</span></h2>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="#" class="active">
                        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="index.html" target="_blank">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        View Website
                    </a>
                </li>
                <li>
                    <a href="dashboard.html" target="_blank">
                        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        User View
                    </a>
                </li>
            </ul>
        </div>

        <button onclick="logoutAdmin()" class="logout-btn">
            Logout
        </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="top-header">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="Tafuta game iliyopakiwa...">
            </div>

            <div class="user-profile">
                <div class="admin-info">
                    <strong>Admin Panel</strong>
                    <span id="adminEmailDisplay">Checking...</span>
                </div>
                <div class="user-avatar">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=NeonUser" alt="Avatar">
                </div>
            </div>
        </header>

        <!-- STATS -->
        <section class="stats-grid">
            <div class="stat-card">
                <h4>TOTAL GAMES</h4>
                <div class="value" id="totalGamesCount">0</div>
            </div>
            <div class="stat-card pink">
                <h4>SYSTEM STATUS</h4>
                <div class="value" style="font-size: 20px; color: var(--neon-pink);">ONLINE</div>
            </div>
            <div class="stat-card">
                <h4>DATABASE</h4>
                <div class="value" style="font-size: 20px; color: var(--neon-cyan);">ACTIVE</div>
            </div>
        </section>

        <!-- PANELS -->
        <section class="dashboard-panels">
            
            <!-- UPLOAD FORM PANEL -->
            <div class="panel">
                <div class="panel-header">
                    <h3>PAKIA GAME MPYA</h3>
                </div>
                <div id="statusMsg" class="status-msg"></div>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Game Title</label>
                        <input type="text" class="form-control" id="title" placeholder="e.g. Tomb Raider Underworld" required>
                    </div>
                    <div class="form-group">
                        <label>Slug (URL Key)</label>
                        <input type="text" class="form-control" id="slug" placeholder="e.g. tr-underworld-v1" required>
                    </div>
                    <div class="form-group">
                        <label>Category / Platform</label>
                        <select class="form-control" id="category">
                            <option value="PC Game">PC Game</option>
                            <option value="Android Game">Android Game</option>
                            <option value="Action">Action</option>
                            <option value="Racing">Racing</option>
                            <option value="RPG / Open World">RPG / Open World</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>File Size</label>
                        <input type="text" class="form-control" id="file_size" placeholder="e.g. 7.5 GB" required>
                    </div>
                    <div class="form-group">
                        <label>Cover Image URL</label>
                        <input type="url" class="form-control" id="cover_image" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Download Link URL</label>
                        <input type="url" class="form-control" id="download_url" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="form-control" id="description" rows="2" placeholder="Maelezo mepesi..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">🚀 PUBLISH GAME</button>
                </form>
            </div>

            <!-- GAMES LIST PANEL -->
            <div class="panel">
                <div class="panel-header">
                    <h3>MAGAME YALIYOPAKIWA</h3>
                </div>
                <div class="games-list-container" id="gamesListContainer">
                    <p style="color: var(--text-dim); text-align: center; padding: 20px;">Inapakua magame...</p>
                </div>
            </div>

        </section>
    </main>

    <!-- BACKEND SCRIPT -->
    <script>
        const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // BADILISHA EMAIL HII IWE EMAIL YAKO YA ADMIN YA SUPABASE
        const ADMIN_EMAIL = "admin@kodinela.com"; 

        let allGamesCache = [];

        // 1. KAGUA RUHUSA YA ADMIN
        async function checkAdminAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session || session.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                alert("⛔ Ruhusa Imekataliwa! Sehemu hii ni ya Admin pekee.");
                window.location.href = "login.html";
                return false;
            }

            document.getElementById('adminEmailDisplay').innerText = session.user.email;
            return true;
        }

        // 2. VUTA MAGAME YOTE KUTOKA SUPABASE
        async function loadGames() {
            const container = document.getElementById('gamesListContainer');
            try {
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allGamesCache = games || [];
                document.getElementById('totalGamesCount').innerText = allGamesCache.length;

                renderGamesList(allGamesCache);

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:var(--neon-pink); text-align:center;">Imeshindikana kupakua magame.</p>`;
            }
        }

        // RENDER LIST
        function renderGamesList(games) {
            const container = document.getElementById('gamesListContainer');
            if (!games || games.length === 0) {
                container.innerHTML = `<p style="color:var(--text-dim); text-align:center; padding: 20px;">Hakuna game iliyopakiwa bado.</p>`;
                return;
