<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Dashboard</title>

    <style>
        :root {
            --bg-body: #20232b;
            --bg-card: #25262d;
            --bg-input: #202127;
            --neon-cyan: #35eaff;
            --neon-pink: #ff0a6c;
            --text-main: #eeeeee;
            --text-dim: #777983;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================== */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 10px 0 25px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand svg {
            width: 32px;
            height: 32px;
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .brand h2 {
            font-size: 20px;
            letter-spacing: 3px;
            color: var(--text-main);
        }

        .brand h2 span {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .nav-links a svg {
            width: 20px;
            height: 20px;
            fill: var(--text-dim);
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
            background: var(--bg-input);
            box-shadow: 
                inset 3px 3px 6px rgba(0,0,0,0.4),
                0 0 12px rgba(53, 234, 255, 0.2);
        }

        .nav-links a.active svg, .nav-links a:hover svg {
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: 700;
            border-radius: 15px;
            background: var(--bg-input);
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .logout-btn:hover {
            box-shadow: 0 0 15px rgba(255, 10, 108, 0.4);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        /* =========================
           MAIN CONTENT AREA
        ========================== */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* HEADER */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            background: var(--bg-input);
            border: none;
            outline: none;
            border-radius: 25px;
            padding: 0 20px 0 45px;
            color: var(--text-main);
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.4),
                inset -2px -2px 6px rgba(255,255,255,0.02);
        }

        .search-box svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-dim);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            padding: 2px;
            box-shadow: 0 0 10px rgba(53, 234, 255, 0.5);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-card);
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            position: relative;
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.3),
                -5px -5px 15px rgba(255,255,255,0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        .stat-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .stat-card.pink::before {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .stat-card h4 {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* CONTENT PANELS */
        .dashboard-panels {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .panel {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.3),
                -5px -5px 15px rgba(255,255,255,0.02);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-header h3 {
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* CYBER CHART PLACEHOLDER */
        .chart-placeholder {
            height: 220px;
            background: var(--bg-input);
            border-radius: 15px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px;
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.4);
        }

        .bar {
            width: 30px;
            background: linear-gradient(to top, var(--neon-cyan), var(--neon-pink));
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(53, 234, 255, 0.4);
            transition: height 0.5s ease;
        }

        /* ACTIVITY LIST */
        .activity-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: var(--bg-input);
            border-radius: 12px;
            font-size: 14px;
        }

        .activity-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 6px var(--neon-cyan);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .dashboard-panels { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

</body>
