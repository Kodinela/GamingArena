<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kodinela Gaming Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #14161d; --bg-card: #1f222d; --neon-cyan: #35eaff; --neon-pink: #ff0a6c; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: var(--bg-card); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(53, 234, 255, 0.2); }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: var(--neon-cyan); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        .form-group input { width: 100%; padding: 12px; background: #171922; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 14px; background: var(--neon-cyan); border: none; color: #12141a; font-weight: bold; border-radius: 10px; cursor: pointer; }
        button:hover { background: var(--neon-pink); color: #fff; }
        .error-msg { color: var(--neon-pink); font-size: 14px; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔑 INGIA (LOGIN)</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Barua Pepe (Email)</label>
                <input type="email" id="email" required placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Nenosiri (Password)</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn">Ingia Akunti</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // BADILISHA EMAIL HII IWE EMAIL YAKO YA ADMIN
        const ADMIN_EMAIL = "admin@kodinela.com"; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // Kama ni admin elekeza admin.html, kama ni user wa kawaida elekeza dashboard.html
                if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                errorMsg.innerText = "❌ Login Imefeli: " + err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
