<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kodinela Gaming Arena</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-body: #0b0c10;
            --bg-card: rgba(23, 26, 35, 0.85);
            --bg-input: #12141c;
            --neon-cyan: #35eaff;
            --neon-pink: #ff0a6c;
            --text-main: #ffffff;
            --text-dim: #8a8f9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 10, 108, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(53, 234, 255, 0.15) 0%, transparent 40%);
            overflow: hidden;
        }

        /* NEON GLOW CONTAINER */
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(53, 234, 255, 0.2);
            box-shadow: 
                0 0 30px rgba(53, 234, 255, 0.15),
                inset 0 0 15px rgba(255, 10, 108, 0.05);
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), transparent, var(--neon-pink));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.4;
        }

        .brand-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(53, 234, 255, 0.5);
            margin-bottom: 5px;
        }

        .brand-title span { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 10, 108, 0.5); }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(53, 234, 255, 0.4);
        }

        /* NEON GLOW BUTTON */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--neon-cyan), #00a8ff);
            border: none;
            color: #0b0c10;
            font-weight: 800;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(53, 234, 255, 0.4);
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(90deg, var(--neon-pink), #ff5252);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 10, 108, 0.7);
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--neon-pink);
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            padding: 10px;
            background: rgba(255, 10, 108, 0.1);
            border: 1px solid var(--neon-pink);
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-title">KODINELA <span>ARENA</span></div>
        <div class="subtitle">Access Portal</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Barua Pepe (Email)</label>
                <input type="email" id="email" required placeholder="player@kodinela.com">
            </div>

            <div class="form-group">
                <label>Nenosiri (Password)</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="loginBtn">🚀 INGIA PORTAL</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // BADILISHA EMAIL HII IWE EMAIL YAKO YA ADMIN
        const ADMIN_EMAIL = "admin@kodinela.com"; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loginBtn.innerText = 'INAHAKIKI...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // Mwelekeo sahihi kulingana na akaunti
                if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                errorMsg.innerText = "❌ Login Imefeli: " + err.message;
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.innerText = '🚀 INGIA PORTAL';
            }
        });
    </script>
</body>
</html>
