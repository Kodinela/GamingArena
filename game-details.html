<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details | Kodinela Gaming Arena</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-body: #20232b;
            --bg-card: #25262d;
            --bg-input: #202127;
            --neon-cyan: #35eaff;
            --neon-pink: #ff0a6c;
            --text-main: #eeeeee;
            --text-dim: #777983;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 20px 5%; }

        header { margin-bottom: 30px; }
        .back-btn { color: var(--neon-cyan); text-decoration: none; font-weight: bold; font-size: 16px; }

        .container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            margin: auto;
            border: 1px solid rgba(53, 234, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-banner {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .title { font-size: 32px; margin-bottom: 15px; color: #fff; }
        .meta { display: flex; gap: 20px; color: var(--text-dim); margin-bottom: 25px; font-weight: bold; }
        .meta span { background: var(--bg-input); padding: 6px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }

        .description { font-size: 16px; line-height: 1.8; color: #ccc; margin-bottom: 30px; white-space: pre-line; }

        .download-btn {
            display: inline-block;
            background: var(--neon-cyan);
            color: #172127;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(53, 234, 255, 0.4);
            transition: 0.3s;
        }

        .download-btn:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 20px var(--neon-pink); }
        .error-msg { text-align: center; color: var(--neon-pink); font-size: 18px; padding: 50px 0; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Rudi Home</a>
    </header>

    <main class="container" id="detailsContainer">
        <p style="text-align: center; color: var(--text-dim);">Inapakua maelezo ya game...</p>
    </main>

    <script>
        const SUPABASE_URL = "https://acjomyksibajajgsypkm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_alINFU4nBPTFyTrJcpCGcQ_P_QiX83z";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Chukua 'slug' kutoka kwenye URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameSlug = urlParams.get('slug');

        async function fetchGameDetails() {
            const container = document.getElementById('detailsContainer');

            if (!gameSlug) {
                container.innerHTML = `<div class="error-msg">⚠️ Hakuna game iliyochaguliwa.</div>`;
                return;
            }

            try {
                // Tafuta game inayofanana na slug husika
                const { data: game, error } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('slug', gameSlug)
                    .single();

                if (error || !game) {
                    container.innerHTML = `<div class="error-msg">❌ Game haijapatikana.</div>`;
                    return;
                }

                container.innerHTML = `
                    <img src="${game.cover_image || 'https://picsum.photos/800/400?gaming'}" class="game-banner" alt="${game.title}">
                    <h1 class="title">${game.title}</h1>
                    <div class="meta">
                        <span>Aina: ${game.category || 'PC / Android'}</span>
                        <span>Ukubwa: ${game.file_size || 'N/A'}</span>
                    </div>
                    <div class="description">${game.description || 'Hakuna maelezo yaliyowekwa.'}</div>
                    <a href="${game.download_url || '#'}" class="download-btn" target="_blank">Download Game</a>
                `;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="error-msg">⚠️ Kosa limetokea wakati wa kupakua data.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchGameDetails);
    </script>
</body>
</html>
